<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="SwingCoach - on-device golf swing analysis for iOS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B2E1A"/>
      <stop offset="55%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#1F7A46"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#35C878" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#35C878" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#9BE8C0" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="0" fill="url(#bg)"/>

  <!-- subtle fairway contour lines -->
  <path d="M0 268 C 220 238, 430 292, 690 258 S 1010 232, 1200 262" fill="none" stroke="#35C878" stroke-opacity="0.16" stroke-width="2"/>
  <path d="M0 300 C 260 274, 470 324, 720 292 S 1030 268, 1200 296" fill="none" stroke="#35C878" stroke-opacity="0.10" stroke-width="2"/>

  <!-- wordmark -->
  <text x="80" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">SwingCoach</text>
  <text x="82" y="196" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#9BE8C0">Film your swing. Get one thing to fix.</text>

  <!-- feature chips -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#DFF7E9">
    <rect x="80" y="228" width="132" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="146" y="250" text-anchor="middle">100% on-device</text>
    <rect x="222" y="228" width="112" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="278" y="250" text-anchor="middle">No account</text>
    <rect x="344" y="228" width="150" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="419" y="250" text-anchor="middle">SwiftUI + Vision</text>
  </g>

  <!-- swing arc -->
  <path d="M1052 268 C 900 268, 852 150, 946 86 C 1030 28, 1132 78, 1128 160" fill="none" stroke="url(#arc)" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 14"/>

  <!-- golfer skeleton (mirrors the app's pose overlay) -->
  <g stroke="#9BE8C0" stroke-width="4" stroke-linecap="round" fill="none" stroke-opacity="0.95">
    <!-- spine -->
    <path d="M983 120 L 989 196"/>
    <!-- shoulders -->
    <path d="M955 132 L 1012 132"/>
    <!-- hips -->
    <path d="M966 198 L 1013 198"/>
    <!-- left leg -->
    <path d="M966 198 L 957 248 L 951 292"/>
    <!-- right leg -->
    <path d="M1013 198 L 1017 248 L 1022 292"/>
    <!-- arms to grip -->
    <path d="M955 132 L 972 172 L 988 180"/>
    <path d="M1012 132 L 1000 172 L 988 180"/>
  </g>
  <!-- club shaft -->
  <path d="M988 180 L 936 268" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.9"/>
  <path d="M936 268 L 922 270" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-opacity="0.9"/>
  <!-- head -->
  <circle cx="983" cy="102" r="17" fill="none" stroke="#9BE8C0" stroke-width="4"/>
  <!-- joint keypoints -->
  <g fill="#35C878">
    <circle cx="955" cy="132" r="5.5"/><circle cx="1012" cy="132" r="5.5"/>
    <circle cx="966" cy="198" r="5.5"/><circle cx="1013" cy="198" r="5.5"/>
    <circle cx="957" cy="248" r="5.5"/><circle cx="1017" cy="248" r="5.5"/>
    <circle cx="972" cy="172" r="5"/><circle cx="1000" cy="172" r="5"/>
    <circle cx="988" cy="180" r="6" fill="#FFFFFF"/>
  </g>
  <!-- ball -->
  <circle cx="916" cy="272" r="7" fill="#FFFFFF"/>
</svg>
